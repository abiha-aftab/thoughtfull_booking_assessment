services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      API_PORT: 4000
      MONGODB_URI: mongodb://mongo:27017/thoughtfull-booking
      WEB_ORIGIN: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
